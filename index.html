<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Разбор ПАТ</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-hover: #243044;
      --border: #2d3a4f;
      --text: #e8edf4;
      --text-muted: #9aa8bc;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --nav-height: 56px;
      --footer-min: 30vh;
      --card-size: 8.5rem;        /* размер карточки (ширина и высота) */
      --card-num-size: 2rem;      /* размер номера на лицевой стороне */
      --card-text-size: 0.82rem;  /* размер текста на обороте */
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .top-nav {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      min-height: var(--nav-height);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
    }

    .nav-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
      font-weight: 600;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 1rem 1.5rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .slide-header {
      flex-shrink: 0;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .reset-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .reset-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--accent);
    }

    .slide-header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .cards-row {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 0.5rem;
      overflow-y: auto;
      padding-bottom: 0.25rem;
    }

    .card {
      width: var(--card-size);
      height: var(--card-size);
      flex-shrink: 0;
      perspective: 900px;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      font: inherit;
      color: inherit;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
    }

    .card.revealed .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 12px;
      border: 2px solid var(--border);
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
    }

    .card-front {
      background: var(--surface);
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover .card-front {
      background: var(--surface-hover);
      border-color: #4a5d78;
    }

    .card.selected .card-front {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .card.revealed .card-front {
      border-color: var(--success);
    }

    .card-back {
      background: linear-gradient(145deg, #1e3a2f, var(--surface));
      border-color: var(--success);
      transform: rotateY(180deg);
    }

    .card-num {
      font-size: var(--card-num-size);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    .card-short {
      font-size: var(--card-text-size);
      font-weight: 600;
      line-height: 1.25;
      color: #bbf7d0;
      overflow-y: auto;
      max-height: 100%;
    }

    .info-panel {
      flex: 0 0 auto;
      min-height: var(--footer-min);
      background: var(--surface);
      border-top: 2px solid var(--border);
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
    }

    .info-panel-inner {
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(var(--footer-min) - 2.5rem);
    }

    .info-panel .info-title {
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      font-weight: 600;
      color: #93c5fd;
      margin-bottom: 0.65rem;
    }

    .info-panel .info-body {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      line-height: 1.55;
      color: var(--text);
    }

    .load-error {
      padding: 2rem;
      text-align: center;
      color: #fca5a5;
    }

    .load-error code {
      display: block;
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

  </style>
</head>
<body>
  <nav class="top-nav" id="top-nav" aria-label="Навигация по вводным"></nav>
  <main id="main" hidden>
    <header class="slide-header">
      <h1 id="slide-title"></h1>
      <button type="button" class="reset-btn" id="reset-btn">↺</button>
    </header>
    <section class="cards-row" id="cards-grid" aria-label="Карточки действий"></section>
  </main>
  <footer class="info-panel" id="info-panel">
    <div class="info-panel-inner">
      <div class="info-body" id="info-body"></div>
    </div>
  </footer>

  <script src="quiz-data.js"></script>
  <script>
    const state = {
      slides: [],
      currentIndex: 0,
      selectedCardId: null
    };

    function showLoadError(msg) {
      document.getElementById('main').hidden = true;
      document.getElementById('top-nav').innerHTML =
        '<p class="load-error">Ошибка данных: ' + escapeHtml(msg) +
        '<code>Проверьте файл quiz-data.js (он должен лежать рядом с index.html).</code></p>';
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function buildNav() {
      const nav = document.getElementById('top-nav');
      nav.innerHTML = '';
      state.slides.forEach((slide, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-btn' + (i === state.currentIndex ? ' active' : '');
        btn.textContent = slide.navLabel || ('Вводная ' + (i + 1));
        btn.addEventListener('click', () => goToSlide(i));
        nav.appendChild(btn);
      });
    }

    function goToSlide(index) {
      state.currentIndex = index;
      state.selectedCardId = null;
      buildNav();
      renderSlide();
      resetInfoPanel();
    }

    function resetInfoPanel() {
      const body = document.getElementById('info-body');
      body.className = 'info-body';
      const slide = state.slides[state.currentIndex];
      body.innerHTML = slide.introText
        ? '<div class="info-intro">' + escapeHtml(slide.introText) + '</div>'
        : '';
    }

    function setInfoPanel(card) {
      const body = document.getElementById('info-body');
      body.className = 'info-body';
      body.innerHTML =
        '<div class="info-title">' + escapeHtml(card.shortDescription || 'Действие') + '</div>' +
        '<div>' + escapeHtml(card.extendedInfo || card.shortDescription || '') + '</div>';
    }

    function renderSlide() {
      const slide = state.slides[state.currentIndex];
      document.getElementById('slide-title').textContent = slide.title || '';

      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';

      (slide.cards || []).forEach((card, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card' +
          (card._revealed ? ' revealed' : '') +
          (state.selectedCardId === card.id ? ' selected' : '');
        btn.dataset.id = String(card.id);
        btn.setAttribute('aria-expanded', card._revealed ? 'true' : 'false');
        btn.setAttribute('aria-label', 'Карточка ' + (idx + 1));

        btn.innerHTML =
          '<div class="card-inner">' +
            '<div class="card-face card-front">' +
              '<span class="card-num">' + (idx + 1) + '</span>' +
            '</div>' +
            '<div class="card-face card-back">' +
              '<span class="card-short">' + escapeHtml(card.shortDescription || card.text || '') + '</span>' +
            '</div>' +
          '</div>';

        btn.addEventListener('click', () => onCardClick(card));
        grid.appendChild(btn);
      });
    }

    function resetCards() {
      const slide = state.slides[state.currentIndex];
      (slide.cards || []).forEach(c => { c._revealed = false; });
      state.selectedCardId = null;
      renderSlide();
      resetInfoPanel();
    }

    function onCardClick(card) {
      if (!card._revealed) {
        card._revealed = true;
      }
      state.selectedCardId = card.id;
      setInfoPanel(card);
      document.querySelectorAll('.card').forEach(function (el) {
        el.classList.toggle('revealed', el.dataset.id === String(card.id) || el.classList.contains('revealed'));
        el.classList.toggle('selected', el.dataset.id === String(card.id));
        el.setAttribute('aria-expanded', el.classList.contains('revealed') ? 'true' : 'false');
      });
    }

    function startApp(data) {
      const slides = data.slides;
      slides.forEach(slide => {
        (slide.cards || []).forEach(c => {
          c._revealed = false;
        });
      });
      state.slides = slides;
      document.getElementById('main').hidden = false;
      document.getElementById('top-nav').innerHTML = '';
      buildNav();
      renderSlide();
      resetInfoPanel();
    }

    document.getElementById('reset-btn').addEventListener('click', resetCards);

    function init() {
      if (typeof QUIZ_DATA === 'undefined' || !QUIZ_DATA || !Array.isArray(QUIZ_DATA.slides) || !QUIZ_DATA.slides.length) {
        showLoadError('в quiz-data.js не найден массив slides');
        return;
      }
      startApp(QUIZ_DATA);
    }

    init();
  </script>
</body>
</html>
